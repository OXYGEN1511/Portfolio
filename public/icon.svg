<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="176" height="176" rx="38" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Glowing Accent Dot -->
  <circle cx="136" cy="116" r="6" fill="#06b6d4" filter="url(#glow)" />

  <!-- Monogram TR with tech styled lines -->
  <g filter="url(#glow)">
    <!-- T Letter -->
    <path d="M42 54 H88 M65 54 V126" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R Letter -->
    <path d="M96 126 V54 H120 C134 54 144 64 144 78 C144 91 135 100 120 101 M114 101 L140 126" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
